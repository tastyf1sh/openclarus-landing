<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarus</title>

<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0b1c2c;
        color: #ffffff;
    }

    .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    .logo {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }

    .logo span {
        color: #2ec4ff;
    }

    h1 {
        font-size: 48px;
        font-weight: 300;
        max-width: 800px;
        margin: 0;
    }

    p {
        margin-top: 20px;
        font-size: 18px;
        color: #a0b3c5;
    }

    .btn {
        margin-top: 40px;
        padding: 14px 28px;
        border-radius: 6px;
        background: #2ec4ff;
        color: #0b1c2c;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn:hover {
        background: #1da8dc;
    }

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>C</span>larus
    </div>

    <h1>
        Clear insight for hospitality
    </h1>

    <p>
        Stock. Costing. GP. All in one place.
    </p>

    <a href="https://app.openclarus.com" class="btn">
        Open App
    </a>

</div>

</body>
</html>
